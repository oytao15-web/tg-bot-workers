name = "tg-bot-workers"
main = "src/index.ts"
compatibility_date = "2024-06-01"
compatibility_flags = ["nodejs_compat"]

# Environment variables (use `wrangler secret put` for sensitive values)
[vars]
BOT_USERNAME = "YourBotUsername"
ADMIN_IDS = "123456789,987654321"  # Comma-separated Telegram user IDs

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "tg-bot-db"
database_id = "fbac1ae2-f496-4448-88b6-ec37c8826f23"

# KV Namespace for caching
[[kv_namespaces]]
binding = "CACHE"
id = "e4f45dccc7884da9aca62f37ba7bf484"

# Cron Triggers for scheduled tasks
[triggers]
crons = ["*/5 * * * *"]  # Every 5 minutes for scheduled announcements
